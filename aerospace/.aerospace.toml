# Config schema version. Enables 'persistent-workspaces' and other v2 options.
config-version = 2

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
after-login-command = []
# Available commands: https://nikitabobko.github.io/AeroSpace/commands

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    # JankyBorders has a built-in detection of already running process,
    # so it won't be run twice on AeroSpace restart
    'exec-and-forget borders active_color=0xff1688f0 inactive_color=0xff494d64 width=6.0'
]

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# Not supported yet in 0.20.3-Beta — uncomment once AeroSpace is updated
# auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 10

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = 'move-mouse window-lazy-center' # Disabled: fights mouse drag across monitors (#634)

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Keep all named workspaces alive even when empty and invisible,
# so they never drop out of cycling/listing. Requires config-version = 2.
persistent-workspaces = ['M1', 'M2', 'M3']




# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'


[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.top = 5
outer.bottom = 5
outer.right = 5

# Monitor parking workspaces. Numeric monitor patterns are ordered left-to-right
# (1-based). Fallbacks keep config valid when only 1 or 2 monitors are attached.
# Note: move-workspace-to-monitor (alt-shift-tab, alt-shift-1..4) fails for these workspaces.
# See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[workspace-to-monitor-force-assignment]
M1 = 1
M2 = [2, 1]
M3 = [3, 2, 1]

[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-m = 'layout tiles horizontal vertical'
    alt-n = 'layout accordion'
    alt-f = 'layout floating tiling' # 'floating toggle' in i3
    alt-c = 'exec-and-forget $HOME/.config/aerospace/center-window.sh' # Center focused floating window


    # alt-enter = 'exec-and-forget open -n /Applications/Alacritty.app' # use Super + N to open new alacritty terminal
#cmd-enter = 'macos-native-fullscreen'
# cmd-q = 'close'
    cmd-e = 'macos-native-minimize'
    cmd-m = 'fullscreen'
    alt-left = 'echo -- T1 T2 T3 BROWSER CHAT MEETING M1 M2 M3 | workspace --wrap-around --stdin prev'
    alt-right = 'echo -- T1 T2 T3 BROWSER CHAT MEETING M1 M2 M3 | workspace --wrap-around --stdin next'
    alt-up = 'focus-monitor prev'
    alt-down = 'focus-monitor next'
#    cmd-shift-left = 'move-workspace-to-monitor prev'
#cmd-shift-right = 'move-workspace-to-monitor next'
# cmd-shift-c = 'reload-config'
    f11 = 'fullscreen'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
# cmd-shift-m = 'mode manage'
    cmd-shift-r = 'mode resize'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus

    # Vim-like window focus.
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    ctrl-alt-h = 'focus-monitor --wrap-around left'
    ctrl-alt-l = 'focus-monitor --wrap-around right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#join-with
    ctrl-alt-shift-h = 'join-with left'
    ctrl-alt-shift-j = 'join-with down'
    ctrl-alt-shift-k = 'join-with up'
    ctrl-alt-shift-l = 'join-with right'


    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    cmd-f1 = 'workspace T1'
    cmd-f2 = 'workspace T2'
    cmd-f3 = 'workspace T3'
    cmd-f4 = 'workspace BROWSER'
    cmd-f5 = 'workspace CHAT'
    cmd-f6 = 'workspace MEETING'
    cmd-f7 = 'workspace M1'
    cmd-f8 = 'workspace M2'
    cmd-f9 = 'workspace M3'

    # Summon: bring the workspace to the monitor you're looking at (Xmonad-style),
    # instead of jumping focus to the workspace's monitor.
    # See: https://nikitabobko.github.io/AeroSpace/commands#summon-workspace
    cmd-shift-f1 = 'summon-workspace T1'
    cmd-shift-f2 = 'summon-workspace T2'
    cmd-shift-f3 = 'summon-workspace T3'
    cmd-shift-f4 = 'summon-workspace BROWSER'
    cmd-shift-f5 = 'summon-workspace CHAT'
    cmd-shift-f6 = 'summon-workspace MEETING'
    cmd-shift-f7 = 'summon-workspace M1'
    cmd-shift-f8 = 'summon-workspace M2'
    cmd-shift-f9 = 'summon-workspace M3'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    cmd-alt-1 = ['move-node-to-workspace T1', 'workspace T1']
    cmd-alt-f1 = ['move-node-to-workspace T1', 'workspace T1']
    cmd-alt-2 = ['move-node-to-workspace T2', 'workspace T2']
    cmd-alt-f2 = ['move-node-to-workspace T2', 'workspace T2']
    cmd-alt-3 = ['move-node-to-workspace T3', 'workspace T3']
    cmd-alt-f3 = ['move-node-to-workspace T3', 'workspace T3']
    cmd-alt-4 = ['move-node-to-workspace BROWSER', 'workspace BROWSER']
    cmd-alt-f4 = ['move-node-to-workspace BROWSER', 'workspace BROWSER']
    cmd-alt-5 = ['move-node-to-workspace CHAT', 'workspace CHAT']
    cmd-alt-f5 = ['move-node-to-workspace CHAT', 'workspace CHAT']
    cmd-alt-6 = ['move-node-to-workspace MEETING', 'workspace MEETING']
    cmd-alt-f6 = ['move-node-to-workspace MEETING', 'workspace MEETING']
    cmd-alt-7 = ['move-node-to-workspace M1', 'workspace M1']
    cmd-alt-f7 = ['move-node-to-workspace M1', 'workspace M1']
    cmd-alt-8 = ['move-node-to-workspace M2', 'workspace M2']
    cmd-alt-f8 = ['move-node-to-workspace M2', 'workspace M2']
    cmd-alt-9 = ['move-node-to-workspace M3', 'workspace M3']
    cmd-alt-f9 = ['move-node-to-workspace M3', 'workspace M3']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Move workspace to monitor by display arrangement: left-to-right, 1-based.
    # NOTE: fails for force-assigned workspaces (M1, M2, M3) — use summon-workspace instead
    alt-shift-1 = 'move-workspace-to-monitor 1'
    alt-shift-2 = 'move-workspace-to-monitor 2'
    alt-shift-3 = 'move-workspace-to-monitor 3'
    alt-shift-4 = 'move-workspace-to-monitor 4'

    # Move individual window to monitor by display arrangement: left-to-right, 1-based.
    ctrl-alt-1 = 'move-node-to-monitor 1'
    ctrl-alt-2 = 'move-node-to-monitor 2'
    ctrl-alt-3 = 'move-node-to-monitor 3'
    ctrl-alt-4 = 'move-node-to-monitor 4'



    #
    cmd-alt-h = [] # Disable "hide others"
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
  #salt-shift-semicolon = 'mode service'
  # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
#
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    cmd-shift-comma = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    b = ['balance-sizes', 'mode main'] # Equalize window sizes
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

[mode.resize.binding]
h = 'resize width -75'
j = 'resize height +75'
k = 'resize height -75'
l = 'resize width +75'
enter = 'mode main'
esc = 'mode main'




# Floating apps
[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.linguee.DeepLCopyTranslator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

# Workspace assignments
[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace BROWSER'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace T3'

[[on-window-detected]]
if.app-id = 'com.jetbrains.pycharm'
run = 'move-node-to-workspace T3'

#[[on-window-detected]]
#if.app-id = 'com.github.wez.wezterm'
#run = 'move-node-to-workspace T1'

#[[on-window-detected]]
#if.app-id = 'com.mitchellh.ghostty'
#run = 'move-node-to-workspace T1'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace CHAT'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace MEETING'
